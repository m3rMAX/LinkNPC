name: LinkNPC
version: 1.1.0
main: com.linknpc.LinkNPC
api-version: '1.21'
author: m3rMAX
description: Animated clickable Discord and YouTube NPCs without a resource pack.
commands:
  npchero:
    description: Create and manage clickable LinkNPC characters.
    usage: /NPCHERO <discord|youtube|remove|list|help>
    aliases: [npc]
    permission: linknpc.use
permissions:
  linknpc.use:
    description: Allows using LinkNPC commands.
    default: op
