
name: Build LinkNPC

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          

      - name: Prepare source files
        run: |
          mkdir -p src/main/java/com/linknpc
          mkdir -p src/main/resources
          cp LinkNPC.java src/main/java/com/linknpc/LinkNPC.java
          cp plugin.yml src/main/resources/plugin.yml

      - name: Build plugin
        run: mvn --batch-mode clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LinkNPC-JAR
          path: target/*.jar
          if-no-files-found: error
